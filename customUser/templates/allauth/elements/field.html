{% load allauth %}
{% if attrs.type == "checkbox" or attrs.type == "radio" %}
	<label class="check" for="{{ attrs.id }}">
		<input type="{{ attrs.type }}"{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}{% if attrs.checked %} checked{% endif %}{% if attrs.disabled %} disabled{% endif %}>
		<span>{% slot label %}{% endslot %}</span>
	</label>
{% else %}
	<div class="field">
		<label for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
		<input type="{{ attrs.type }}"{% if attrs.required %} required{% endif %}{% if attrs.disabled %} disabled{% endif %}{% if attrs.readonly %} readonly{% endif %}{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.placeholder %} placeholder="{{ attrs.placeholder }}"{% endif %}{% if attrs.autocomplete %} autocomplete="{{ attrs.autocomplete }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}>
		{% if slots.help_text %}<span class="hint">{% slot help_text %}{% endslot %}</span>{% endif %}
		{% if attrs.errors %}{{ attrs.errors }}{% endif %}
	</div>
{% endif %}
