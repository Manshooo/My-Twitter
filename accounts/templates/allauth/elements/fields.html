{% for field in attrs.form %}
	{% if field.is_hidden %}
		{{ field }}
	{% elif field.widget_type == 'checkbox' %}
		<label class="check" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}{% if field.help_text %}<span class="hint" style="display: block">{{ field.help_text|safe }}</span>{% endif %}</span></label>
		{% if field.errors %}{{ field.errors }}{% endif %}
	{% else %}
		{% include "azzb/includes/field.html" %}
	{% endif %}
{% endfor %}
