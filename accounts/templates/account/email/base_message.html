{% load static seo %}{% comment %}
HTML-версия писем; текстовая (*_message.txt) уходит рядом, allauth собирает multipart сам.
Вёрстка под почтовые клиенты: таблицы и стили в атрибутах (Gmail выбрасывает <style> частично,
Outlook не знает flex), картинка только одна — логотип PNG по полному адресу.
Блоки: preheader (строка-превью в списке писем), title, content, action_url + action_label (кнопка),
after (текст под кнопкой), reason (почему пришло письмо — мелко в подвале).
{% endcomment %}{% static 'images/email-logo.png' as logo_path %}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{% block title %}{% endblock title %}</title>
</head>
<body style="margin: 0; padding: 0; background: #eef5f5; -webkit-text-size-adjust: 100%;">
<div style="display: none; max-height: 0; overflow: hidden; opacity: 0; color: #eef5f5;">{% block preheader %}{% endblock preheader %}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #eef5f5;">
	<tr>
		<td align="center" style="padding: 32px 16px;">
			<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px;">
				<tr>
					<td style="padding: 0 4px 20px;">
						<a href="{% absolute '/' %}" style="text-decoration: none;"><img src="{% absolute logo_path %}" width="124" height="36" alt="AzzB" style="display: block; border: 0; outline: none; color: #13302f; font: 700 22px Arial, sans-serif;"></a>
					</td>
				</tr>
				<tr>
					<td style="padding: 32px; background: #ffffff; border: 1px solid #d6e8e8; border-radius: 20px; font-family: Manrope, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #13302f;">
						<h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.3; font-weight: 800; color: #13302f;">{% block title_body %}{% endblock title_body %}</h1>
						<div style="font-size: 16px; line-height: 1.55; color: #13302f;">{% block content %}{% endblock content %}</div>
						{% block action %}{% endblock action %}
						{% block after %}{% endblock after %}
					</td>
				</tr>
				<tr>
					<td style="padding: 20px 4px 0; font-family: Manrope, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 13px; line-height: 1.5; color: #4e6867;">
						{% block reason %}{% endblock reason %}
						<p style="margin: 8px 0 0;"><a href="{% absolute '/' %}" style="color: #1d6464; font-weight: 700; text-decoration: none;">AzzB</a> — социальная сеть коротких постов.</p>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
