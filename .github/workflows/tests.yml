name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # В main не отменяем: новый push оборвал бы выкладку посреди миграций.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  django:
    name: django (py 3.13, postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # 15 — то, что ставит `apt install postgresql` в Debian 12 на сервере.
        image: postgres:15
        env:
          POSTGRES_USER: azzb
          POSTGRES_PASSWORD: azzb
          POSTGRES_DB: azzb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azzb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "false"
      POSTGRES_DB: azzb
      POSTGRES_USER: azzb
      POSTGRES_PASSWORD: azzb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Та же версия, что в образе (Dockerfile): меняете одну — меняйте и другую.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Известные уязвимости в закреплённых версиях (база PyPI/OSV). Новая уязвимость в уже
      # закреплённой версии сделает CI красным даже без изменений в коде — это и есть сигнал обновиться.
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: Show database backend
        run: python -c "import django, os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'azzb.settings'); django.setup(); from django.db import connection; print(connection.vendor)"

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply to an empty database
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -W default::DeprecationWarning manage.py test azzb api accounts post moderation notifications dm

  # CSS и JS из frontend/ (docs/frontend.md): ESLint и сборка esbuild.
  frontend:
    name: frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Та же версия, что на первой стадии образа (Dockerfile).
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  # Образ собирается на каждом PR (проверка Dockerfile), а публикуется только из main.
  image:
    name: docker image
    needs: [django, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/manshooo/my-twitter:latest
            ghcr.io/manshooo/my-twitter:${{ github.sha }}

  # Self-hosted раннер на сервере под azzb_user (docs/deploy/docker.md, раздел 2). Чужие PR сюда не
  # попадают: джоба только для push в main, а workflow из форков требуют одобрения (настройка репозитория).
  deploy:
    name: deploy to server
    needs: image
    # AZZB_DEPLOY=on (Settings → Secrets and variables → Actions → Variables) — когда раннер настроен;
    # без переменной джоба пропускается, а не висит в очереди без раннера.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZZB_DEPLOY == 'on'
    runs-on: [self-hosted, azzb]
    concurrency:
      group: deploy-azzb
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Sync deploy files
        run: |
          install -m 644 docker-compose.prod.yml /srv/azzb/docker-compose.prod.yml
          install -m 755 deploy/deploy.sh deploy/backup.sh deploy/manage.sh /srv/azzb/
      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        run: /srv/azzb/deploy.sh "${{ github.sha }}"
      - name: ghcr logout
        if: always()
        run: docker logout ghcr.io
