name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: django (py ${{ matrix.python-version }}, postgres)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 — как на сервере, 3.14 — самая новая версия, которую поддерживает Django 5.2.
        python-version: ["3.11", "3.14"]
    services:
      postgres:
        # 15 — то, что ставит `apt install postgresql` в Debian 12 на сервере.
        image: postgres:15
        env:
          POSTGRES_USER: azzb
          POSTGRES_PASSWORD: azzb
          POSTGRES_DB: azzb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azzb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "false"
      POSTGRES_DB: azzb
      POSTGRES_USER: azzb
      POSTGRES_PASSWORD: azzb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show database backend
        run: python -c "import django, os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'azzb.settings'); django.setup(); from django.db import connection; print(connection.vendor)"

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply to an empty database
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python -W default::DeprecationWarning manage.py test azzb api accounts post moderation notifications
