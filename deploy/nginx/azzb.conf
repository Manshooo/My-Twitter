# /etc/nginx/sites-available/azzb — azzb.ru после перехода на Docker (A10, docs/deploy/docker.md).
# Отличия от конфига под uWSGI: proxy_pass на gunicorn вместо uwsgi_pass, нет /static/ (её отдаёт
# приложение), /media/ проксируется в бакет Selectel с кэшем на диске.
# Блок default_server (444 для чужих имён) — общий для всех сайтов сервера, он здесь не повторяется.
# max-age в Strict-Transport-Security — ваш текущий шаг по docs/deploy/security.md, раздел 5.

# Кэш картинок: каждую nginx скачивает из бакета один раз, исходящий трафик Selectel платный.
proxy_cache_path /var/cache/nginx/azzb-media levels=1:2 keys_zone=azzb_media:10m
                 max_size=2g inactive=30d use_temp_path=off;

upstream azzb_web {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    server_name azzb.ru www.azzb.ru;
    return 301 https://azzb.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.azzb.ru;
    ssl_certificate /etc/letsencrypt/live/azzb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azzb.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://azzb.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name azzb.ru;
    ssl_certificate /etc/letsencrypt/live/azzb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azzb.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 4 картинки по 10 МБ + текст и заголовки формы.
    client_max_body_size 45m;

    # Наследуются в location без своих add_header; в /media/ повторены.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /media/ {
        # Публичный домен бакета (Selectel → бакет → «Домены»): без ключа файлы отдаются только через него.
        proxy_pass https://ВАШ-UUID.selstorage.ru/;
        proxy_set_header Host ВАШ-UUID.selstorage.ru;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Cookie и авторизация сайта бакету не нужны.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        # Срок в кэше задают proxy_cache_valid ниже, а не Cache-Control бакета (там год — для браузеров).
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-meta-mtime;

        proxy_cache azzb_media;
        # Сутки без вопросов, потом — условный запрос (304 без тела): так файл, стёртый сайтом
        # (удалённый пост, стёртый аккаунт), пропадает из кэша не позже чем через сутки.
        proxy_cache_valid 200 1d;
        proxy_cache_valid 403 404 1m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Список файлов бакета наружу не отдаём, даже если чтение публичное.
        location = /media/ { return 404; }

        add_header X-Cache $upstream_cache_status;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://azzb_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Настоящий IP посетителя для лимитов (CLIENT_IP_HEADER); присланный посетителем nginx заменяет.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По нему Django понимает, что запрос пришёл по HTTPS (SECURE_PROXY_SSL_HEADER).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}
