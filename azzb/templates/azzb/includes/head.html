{% load static %}<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<link rel="preload" href="{% static 'fonts/manrope-cyrillic.woff2' %}" as="font" type="font/woff2" crossorigin>
		<link rel="stylesheet" href="{% static 'css/azzb.css' %}">
		{# Иконки: docs/brand/make_icons.py. ICO — для старых браузеров и запроса /favicon.ico. #}
		<link rel="icon" href="{% static 'favicon.ico' %}" sizes="48x48">
		<link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
		<link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
		<link rel="manifest" href="{% static 'site.webmanifest' %}">
		<meta name="azzb-sw" content="{% url 'service-worker' %}">
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
		<meta name="theme-color" content="#142626" media="(prefers-color-scheme: dark)">
		<meta property="og:site_name" content="AzzB">
		<meta property="og:locale" content="ru_RU">
		{# Счётчик Метрики: azzb.js загрузит его, только если посетитель разрешил аналитику. #}
		{% if metrika_id %}<meta name="azzb-metrika" content="{{ metrika_id }}"{% if "analytics" in cookie_choice %} data-allowed{% endif %}>{% endif %}
		{# Без eval (его запрещает CSP) и без запуска <script> из подгруженного HTML (azzb/csp.py). #}
		<meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false}'>
		{# nonce — пропуск скрипта через CSP; без него браузер скрипт не выполнит. #}
		<script src="{% static 'vendor/htmx-2.0.4.min.js' %}" nonce="{{ request.csp_nonce }}" defer></script>
		<script src="{% static 'js/azzb.js' %}" nonce="{{ request.csp_nonce }}" defer></script>
